# 导览语音配置
dry_run: true                          # 与 launch 的 dry_run 参数同值
tts_service: /intelligent_interaction/tts/play
audio_id: audio_guide                  # 必须是在 audio_config.json 里允许 stop 的实体

timing:
  query_timeout_s: 120.0   # 单次播报查询硬上限；导览文案可能较长
  query_poll_s: 0.2
  playing_status: playing
  settle_s: 0.4            # 连续非 playing 达到该时长才判定播报结束
  est_char_rate_s: 0.22    # 中文每字估算时长，仅用于进度与兜底
  est_min_duration_s: 1.5
