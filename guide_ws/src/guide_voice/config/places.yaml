# 底盘地图固定为「消防」，别名 -> 点位名（get_pois 返回的 name）。
# 同一个点位配多个别名时，第一个出现的中文名用于播报。
standby: 乐知院

aliases:
  乐知院: 乐知教育
  1号点: 乐知教育
  核心跑酷: 核心力量跑酷
  2号点: 核心力量跑酷
  厕所: 厕所
  卫生间: 厕所
  洗手间: 厕所
  3号点: 厕所
  跆拳道馆: 跆拳道馆
  跆拳道: 跆拳道馆
  4号点: 跆拳道馆
  创想谷: 创想谷
  5号点: 创想谷

# 只作中转、不作为导航目的地的点位：不出现在可去地点清单里。
transfer_points:
  - start_point

# 主线固定点：必须按物理顺序排列，导航时按顺序逐点经过，不跳点。
# 消防地图实测：乐知去跆拳道馆可以一次走完，返程必须逐点中转；
# 所以返程会依次经过 厕所 -> 创想谷 -> 核心力量跑酷 -> 乐知教育。
main_line:
  - 乐知教育
  - 核心力量跑酷
  - 创想谷
  - 厕所
  - 跆拳道馆
