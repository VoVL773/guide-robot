# 导览讲解词配置
#
# intro / outro 分别对应「到起点后」和「返程前」的播报，留空则跳过。
# points 里的键必须与 guide_points.yaml 的 poi_order 点位同名；
# 没有填写讲解词的点位只导航不播报（启动时会有告警）。
#
# head_yaw   : 讲解时头部左右转（弧度，正=向左，限位 ±90°=±1.5708）
# head_pitch : 讲解时头部俯仰（弧度，正=低头，限位 ±25°=±0.4363）
#              抬头看高处展品要填负值
# 点位未单独配置 head_yaw/head_pitch 时使用 head 下的默认值（回中）。

intro: ""
outro: ""

head:
  yaw: 0.0
  pitch: 0.0

points: {}
