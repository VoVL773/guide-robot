# 导览讲解词配置
#
# 第一步只验证「沿轨道走一圈 + 到点播报」，因此每个点位只播一句到达提示。
# 后续再把 text 换成正式讲解词；head_yaw / head_pitch 在启用头部后生效。
#
# points 的键必须与 guide_points.yaml 的 poi_order 同名；
# 没有填写讲解词的点位只导航不播报（启动时会有告警）。

intro: ""
outro: ""

head:
  yaw: 0.0
  pitch: 0.0

points:
  POI_01:
    text: "到达点位1"
  POI_02:
    text: "到达点位2"
  POI_03:
    text: "到达点位3"
  POI_04:
    text: "到达点位4"
  POI_05:
    text: "到达点位5"
