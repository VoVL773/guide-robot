# 导览点位配置 —— 导航与编排共用的唯一配置源
#
# ⚠️ 点位坐标不在本文件里：坐标以底盘 POI 服务端（192.168.11.10:9090）
#    为唯一真源。本文件只维护「用哪些点、按什么顺序走、走哪条轨道」。
#
# ── 标记步骤（用户在地图上标记 POI 后填写）────────────────────────────
#   1. 在底盘/App 里用「建点」把车开到讲解位置，记录 POI 名称；
#   2. 把起点 POI 名称填到 start_poi（开机时车应停在起点附近）；
#   3. 按参观顺序把讲解点 POI 名称填到 poi_order；
#   4. 在底盘里建（或复用）一条串联这些点的轨道，名称填到 tracks.outbound；
#      返程轨道填到 tracks.return（留空则导览结束后点对点回起点）；
#   5. 讲解词在 guide_script.yaml 里按同名 POI 填写；
#   6. 用 `ros2 param` 或 launch 的 dry_run:=true 先空跑一遍，再实机运行。
#
# 校验规则（启动时自动执行）：
#   - poi_order 里的点位、start_poi、轨道名必须能在底盘上找到；
#   - poi_order 不能包含 start_poi，也不能重复；
#   - 未填写点位时导航节点不会崩，只会拒绝所有 goal 并打印本段说明。
# ────────────────────────────────────────────────────────────────────

poi_source: chassis      # 目前只支持 chassis（坐标一律读底盘）

start_poi: POI_START     # 来自地图文件 20261105_080739.bag
poi_order: [POI_01, POI_02, POI_03, POI_04, POI_05]

# 轨道按名称指定：讲解段用 outbound，返程用 return（从最后一个讲解点回起点）
# 当前地图只有一条 track_line_1000，终点即 POI_05，没有返程轨道。
tracks:
  outbound: track_line_1000
  return: ""             # 留空：巡检完停在最后一个点位，不做点对点返程

# 只过点、不停留讲解的点位（默认不停留；需要停留用 dwell_overrides 指定）
transit_pois: []

timeouts:
  to_start_s: 180.0      # 前往起点 / 返回起点的单段超时
  per_poi_s: 180.0       # 单个讲解点的导航超时

# 每个讲解点播报结束后的停留时间（秒），让参观者有观察时间
dwell_s: 5.0

# 单点停留时间覆盖（优先级高于 dwell_s）
dwell_overrides: {}
#   POI_05: 12.0

# 分段限速（m/s）：讲解段与返程段分别下发，节点退出时恢复底盘原值
speed:
  outbound_mps: 0.3
  return_mps: 0.3

# 到点位置容差（米）：实际位姿与 POI 坐标偏差超过该值则本次导航失败
arrival_tolerance_m: 0.5

# 到点朝向覆盖（rad）：只影响底盘在地图里的到点朝向，不改地图点位本身
yaw_overrides: {}
#   POI_05: -1.5708

# 自动重定位：仅在实机模式（dry_run:=false）且定位异常时触发。
# 初始位姿默认取 start_poi 的 x/y/yaw（开机时车应停在起点）。
relocalize:
  enabled: true
  timeout_s: 60.0
  poll_interval_s: 0.5
  # max_time_ms: 60000
  # pose: {x: 0.0, y: 0.0, yaw: 0.0}

# 应用层软限位（超出即拒绝 goal），用于拦截数量级写错的坐标
range_limit:
  x: [-10.0, 45.0]
  y: [-20.0, 20.0]
